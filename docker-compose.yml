# Optional convenience file for running the app on this machine. `run.sh` does
# the same thing with plain podman/docker commands and needs no compose provider
# installed — this machine has none, so run.sh is the path that works out of the
# box. Public hosting is Azure Container Apps; see azure/deploy.sh.
#
#   docker compose up -d        # http://localhost:3000

name: packripper

services:
  app:
    build: .
    # To run the image GitHub Actions publishes instead of building here, drop
    # `build:` and use image: ghcr.io/tahuffman1s/pack-ripper:latest
    image: packripper:latest
    container_name: packripper
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-2M}
      # SvelteKit rejects any POST whose Origin header disagrees with the origin
      # it thinks it is serving, so a wrong value here does not break pages — it
      # breaks every login and purchase. Pin it to the address you type.
      ORIGIN: http://localhost:${PORT:-3000}
    volumes:
      # :z — SELinux is enforcing on Fedora, and a shared label (not :Z) keeps
      # these usable by a natively-run `npm run dev` against the same data.
      - ./.data:/app/.data:z
      - ./.cache:/app/.cache:z
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
