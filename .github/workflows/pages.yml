# Publishes the redirector in pages/ to the `pages` branch, which GitHub Pages
# serves at https://tahuffman1s.github.io/Pack-Ripper/.
#
# Why a branch and not actions/deploy-pages: the site has one file that changes
# far more often than the site itself — status.json, the current tunnel URL.
# run.sh writes that with a single Contents-API PUT from whatever machine is
# hosting the app (see publish_status there), and a branch-served site picks it
# up automatically. Deploying from an artifact instead would mean a workflow run
# per tunnel restart, and the runner would have no idea what the URL is.
#
# So this workflow owns everything on the branch EXCEPT status.json, which it
# carries across untouched. main stays free of URL churn.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages-branch
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the pages branch
      pages: write # to switch Pages on, first run only
    steps:
      - uses: actions/checkout@v4

      - name: Sync pages/ onto the pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          site="$RUNNER_TEMP/site"
          git init -q "$site"
          cd "$site"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # A shallow fetch is enough: we only ever add one commit on top.
          if git fetch -q --depth=1 origin pages 2>/dev/null; then
            git checkout -q -B pages FETCH_HEAD
            echo 'pages branch exists'
          else
            git checkout -q -b pages
            echo 'creating the pages branch'
          fi

          # The live URL is owned by run.sh, not by this repo. Hold it aside
          # while the tracked files are replaced wholesale (so a file deleted in
          # pages/ also disappears from the branch), then put it back.
          live=
          if [ -f status.json ]; then
            cp status.json "$RUNNER_TEMP/status.json"
            live=1
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$GITHUB_WORKSPACE/pages/." .
          if [ -n "$live" ]; then
            cp "$RUNNER_TEMP/status.json" status.json
          fi

          # Same document for a missing path, so a deep link like
          # /Pack-Ripper/packs redirects to <tunnel>/packs instead of 404ing.
          cp index.html 404.html
          # Pages otherwise runs the content through Jekyll, which drops files
          # beginning with an underscore and slows every deploy down.
          touch .nojekyll

          git add -A
          if git rev-parse --verify -q HEAD >/dev/null && git diff --cached --quiet; then
            echo 'branch already matches pages/ — nothing to push'
            exit 0
          fi
          git commit -qm "pages: sync from ${GITHUB_SHA:0:7}"
          git push -q origin pages
          echo 'pushed'

      # Best effort. Needs the repo to allow Actions to configure Pages; if it
      # fails, set it once by hand under Settings -> Pages -> Deploy from a
      # branch -> pages / (root). Already-configured is not an error.
      - name: Point Pages at the branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" \
            --method POST -f 'source[branch]=pages' -f 'source[path]=/' \
          || gh api "repos/$GITHUB_REPOSITORY/pages" \
            --method PUT  -f 'source[branch]=pages' -f 'source[path]=/'
