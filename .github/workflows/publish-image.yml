# Build the runtime image on every push and push it to this repo's GitHub
# Container Registry:
#
#   ghcr.io/tahuffman1s/pack-ripper:latest
#
# That is the whole pipeline. Nothing here deploys: the Azure Container App is
# managed by hand, and a new tag in the registry does not restart it on its own —
# see the run summary, which prints the exact strings the Portal asks for.
#
# GHCR needs no secrets — the automatic GITHUB_TOKEN can write packages as long
# as the job asks for the permission below. The package took this repo's public
# visibility and pulls anonymously; if a fork finds it private instead, flip it
# at github.com/users/<you>/packages/container/pack-ripper/settings.
name: image

on:
  push:
    branches: [main]
    tags: ['v*']
    # The image contains none of this, so a doc edit should not spend five
    # minutes rebuilding it.
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects an uppercase path, and this repo is Pack-Ripper —
      # metadata-action lowercases `images` for us, which is the whole reason to
      # route the name through it rather than interpolating it inline.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64 only. Adding linux/arm64 works but runs `npm ci` and the vite
          # build under QEMU emulation, which takes it from ~3 minutes to ~20.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploying is manual, so the summary is written to be pasted from: the
      # Portal's "create a new revision" form asks for the registry, the image
      # and tag, and the target port as three separate fields.
      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          # The immutable one. Deploying `latest` works but leaves you unable to
          # tell which build a running revision actually is.
          sha_tag=sha-${GITHUB_SHA:0:7}
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          {
            echo '### Pushed'
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo '### To deploy this build'
            echo
            echo '| Portal field | Value |'
            echo '| --- | --- |'
            echo '| Image source | Docker Hub or other registries |'
            echo '| Registry login server | `ghcr.io` |'
            echo '| Authentication | Public |'
            echo "| Image and tag | \`${image#ghcr.io/}:$sha_tag\` |"
            echo '| Target port | `3000` |'
            echo
            echo "Container Apps does not pull a new tag by itself — create a new revision."
          } >> "$GITHUB_STEP_SUMMARY"
