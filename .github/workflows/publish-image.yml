# Build the runtime image on every push and push it to this repo's GitHub
# Container Registry:
#
#   ghcr.io/tahuffman1s/pack-ripper:latest
#
# That is the whole pipeline. Nothing here deploys, in the sense that this job
# never reaches out to a host: it pushes a tag and stops. What happens next is
# the host's business — a Pi installed by deploy/pi/install.sh polls for `latest`
# on a timer and picks this up within the quarter hour, and anything pinned to a
# sha- tag waits to be told. The run summary prints the strings for the latter.
#
# GHCR needs no secrets — the automatic GITHUB_TOKEN can write packages as long
# as the job asks for the permission below. The package took this repo's public
# visibility and pulls anonymously; if a fork finds it private instead, flip it
# at github.com/users/<you>/packages/container/pack-ripper/settings.
#
# The image is a two-platform manifest list, because the cheap places to run it
# are ARM (Oracle Ampere, Hetzner CAX) and the dev machine is x86. Each platform
# builds on a runner of its own architecture rather than under QEMU: `npm ci`
# plus the vite build emulate badly enough to take a 3-minute job past 20.
name: image

on:
  push:
    branches: [main]
    tags: ['v*']
    # The image contains none of this, so editing a doc or a host's compose file
    # should not spend minutes rebuilding it.
    paths-ignore:
      - 'README.md'
      - 'deploy/**'
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      # One architecture failing should still leave the other's log to read.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          # Free for public repos since 2025, and for private ones since
          # January 2026. If this label ever fails to resolve, the fallback is
          # docker/setup-qemu-action and a single job building both platforms.
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects an uppercase path and this repo is Pack-Ripper.
      # metadata-action lowercases whatever it is given, but `outputs:` below
      # needs the bare name too, and that is not an expression bash can touch —
      # so lowercase it once, here, and use it in both places.
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the labels are used here; the tags belong on the manifest list, not
      # on either half of it.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}

      # push-by-digest leaves these two images untagged in the registry. That is
      # deliberate: tagging each one would mean `latest` briefly pointing at a
      # single architecture, and whichever job finished last would win.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          # Separate scopes, or the two architectures evict each other's layers.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # The digest is the only thing the merge job needs, and an empty file named
      # after it is the cheapest way to hand one job's string to another.
      - name: Save the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The tags land here, on a manifest list pointing at both digests. `docker
  # pull` on either architecture then resolves to the right half by itself,
  # which is the entire point of doing it this way.
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Create the manifest list
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          METADATA: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          # Word splitting on the jq output is what turns one string into the
          # several -t arguments imagetools wants, so it must stay unquoted.
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$METADATA") \
            "${refs[@]}"

      # A pinned host is deployed by hand, so the summary is written to be pasted
      # from. A Pi following `latest` needs none of it and will have this build
      # within the quarter hour.
      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          # The immutable one. Deploying `latest` works but leaves you unable to
          # tell which build a running host actually is.
          sha_tag=sha-${GITHUB_SHA:0:7}
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          {
            echo '### Pushed'
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo 'linux/amd64 + linux/arm64.'
            echo
            echo '### To deploy this build'
            echo
            echo 'A Pi set up by `deploy/pi/install.sh` is already following `latest` and will'
            echo 'take this within ~15 minutes, health-check it, and roll back by itself if it'
            echo 'does not answer. Nothing to do.'
            echo
            echo 'Everywhere else — or to pin this exact build — set the immutable tag and pull'
            echo 'just the app:'
            echo
            echo '```'
            echo "sed -i 's/^TAG=.*/TAG=$sha_tag/' .env"
            echo 'docker compose pull app && docker compose up -d app'
            echo '```'
            echo
            echo "Image: \`${image#ghcr.io/}:$sha_tag\` — app listens on \`3000\`."
            echo
            echo 'Leave the `db` service alone. It is pinned to a Postgres major on purpose:'
            echo 'a newer major will not read a data directory written by an older one, so'
            echo 'bumping it needs a pg_dump in hand, not a `pull`.'
          } >> "$GITHUB_STEP_SUMMARY"
