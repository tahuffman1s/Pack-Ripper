# Rolls the freshly built image out to Azure Container Apps.
#
# Runs after the `image` workflow succeeds on main, and deploys that exact
# commit's immutable tag (sha-<short>) rather than `latest` — so what is running
# is always identifiable, and a rollback is one dispatch with an older tag.
#
# Dormant until you set the three repository variables below. One-time setup:
#
#   azure/github-oidc.sh
#
# which creates the app registration, the federated credential trusted only for
# this repo, and the role assignment, then prints the variables to set. No
# client secret is involved and nothing long-lived is stored in the repo.
name: deploy

on:
  workflow_run:
    workflows: [image]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (default: this commit)'
        required: false

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    # No credentials configured yet means nothing to do — better a skipped job
    # than a red X on every push. Also skip when the image build itself failed.
    if: >-
      vars.AZURE_CLIENT_ID != '' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # for the OIDC token azure/login exchanges
      contents: read
    steps:
      - name: Work out the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            tag=$INPUT_TAG
          else
            # metadata-action's type=sha,format=short produces sha-<7 chars>.
            sha=${RUN_SHA:-$GITHUB_SHA}
            tag=sha-${sha:0:7}
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:$tag" >> "$GITHUB_OUTPUT"
          echo "Deploying $tag"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Update the container app
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          RG: ${{ vars.AZURE_RESOURCE_GROUP || 'packripper-rg' }}
          APP: ${{ vars.AZURE_APP_NAME || 'packripper' }}
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors || true
          az containerapp update -n "$APP" -g "$RG" --image "$IMAGE" --only-show-errors -o none
          fqdn=$(az containerapp show -n "$APP" -g "$RG" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "### Deployed \`$IMAGE\` to https://$fqdn" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for it to answer
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP || 'packripper-rg' }}
          APP: ${{ vars.AZURE_APP_NAME || 'packripper' }}
        run: |
          set -euo pipefail
          fqdn=$(az containerapp show -n "$APP" -g "$RG" \
            --query properties.configuration.ingress.fqdn -o tsv)
          # A new revision starts with an empty .cache, so the first response can
          # be a couple of minutes out. Fail the job if it never comes.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "https://$fqdn/api/health" || true)
            if [ "$code" = 200 ]; then
              echo "healthy after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$fqdn/api/health never returned 200"
          exit 1
