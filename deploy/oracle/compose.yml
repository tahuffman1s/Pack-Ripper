# PackRipper on an Oracle Cloud Always Free ARM instance.
#
# Three containers: the app, the Postgres holding every account, and Caddy in
# front for TLS. Oracle gives you a VM and a public IP and nothing else — no
# managed ingress, no certificate — so terminating TLS is this file's job.
#
# Copy this directory to the VM, fill in .env, and:
#
#   docker compose up -d
#
# See ../../README.md § Hosting it on Oracle Cloud for the console steps that
# have to happen first.

name: packripper

services:
  db:
    # Pinned to a major version deliberately: Postgres refuses to read a data
    # directory written by a newer major, so a floating tag turns a routine `pull`
    # into a container that will not start until someone runs pg_upgrade.
    image: postgres:17-alpine
    container_name: packripper-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-packripper}
      POSTGRES_DB: ${POSTGRES_DB:-packripper}
      # `:?` rather than a default — this one faces the internet, even if only via
      # the compose network. Generate one with `openssl rand -base64 24`.
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - generate one with openssl rand -base64 24}'
      # A subdirectory of the mount: initdb refuses a non-empty directory and an
      # ext4 bind mount arrives with a lost+found in it.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # A bind mount, matching the app's, because a thing you back up is a thing
      # you should be able to find. It sits on the VM's own block storage.
      - ./.pgdata:/var/lib/postgresql/data
    # No `ports:`. Reachable from the app over the compose network and from
    # nowhere else. By hand:  docker compose exec db psql -U packripper packripper
    healthcheck:
      # -U matters: without it pg_isready asks after a database named `root` and
      # calls a perfectly healthy server unhealthy.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-packripper} -d ${POSTGRES_DB:-packripper} -q']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  app:
    image: ghcr.io/tahuffman1s/pack-ripper:${TAG:-latest}
    container_name: packripper
    restart: unless-stopped
    depends_on:
      db:
        # The app applies its schema at boot and exits if it cannot connect. It
        # retries first, so this only spares it doing so on every cold start.
        condition: service_healthy
    environment:
      NODE_ENV: production
      # `db` is the service name, resolved on the compose network. Built from the
      # same variable Postgres was created with, so the two cannot drift.
      DATABASE_URL: 'postgres://${POSTGRES_USER:-packripper}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-packripper}'
      HOST: 0.0.0.0
      PORT: 3000
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-2M}
      # SvelteKit rejects any POST whose Origin header disagrees with the origin
      # it thinks it is serving. Caddy terminates TLS and forwards plain HTTP, so
      # the app cannot work this out for itself: it must be told the public
      # https:// name, or pages load fine and every login and purchase fails.
      ORIGIN: https://${DOMAIN}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
    volumes:
      # ~100 MB of regenerated Scryfall, MTGJSON and TCGplayer data, read as
      # thousands of small files. On the VM's own block storage, which is the
      # whole reason a VM suits this app.
      - ./.cache:/app/.cache
      # NOT the database — that is the db service above. Mounted for one reason: a
      # legacy .data/db.json in here is imported into an empty database on first
      # boot, and left untouched. After that this line can go.
      - ./.data:/app/.data
    # Not `ports:`. 3000 is reachable from Caddy over the compose network and
    # from nowhere else, so there is no unencrypted way in from the internet.
    # The admin CLI still works — it runs inside the container over loopback:
    #   docker exec -it packripper admin list
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      # 80 as well as 443, and not only as a redirect: it is where Let's Encrypt
      # answers its own HTTP-01 challenge. Closing it means no certificate and,
      # 60 days later, no renewal.
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The issued certificate and its account key. Without this volume Caddy
      # requests a fresh certificate on every restart and will hit Let's
      # Encrypt's rate limit (5 per name per week) about as fast as you can
      # redeploy.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
