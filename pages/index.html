<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PackRipper</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.svg">
<!--
  A stable front door for a server that has no stable address.

  PackRipper is self-hosted behind a Cloudflare tunnel. A quick tunnel hands out
  a fresh https://<words>.trycloudflare.com hostname every time it starts, so any
  link to it goes stale on the next restart. This page is the link you hand out
  instead: it reads the current hostname out of status.json, checks that it is
  actually answering, and sends you there.

  Two sources for that file, whichever is fresher:

    - status.json next to this page. Same origin, so a ?t= cache-buster is
      honoured, but it only changes once GitHub Pages redeploys the branch —
      usually under a minute behind the commit.
    - the same file read straight off the pages branch through
      raw.githubusercontent.com, which is current the instant run.sh writes it.

  And the URL is never trusted on its own: /api/health has to answer before we
  navigate. That is what makes a dead tunnel show as offline instead of dumping
  you on a Cloudflare error page, and it is why the page can sit here polling and
  redirect on its own the moment a new tunnel comes up.
-->
<style>
	:root {
		--bg: #0b0f1a;
		--card: #121826;
		--line: #1f2937;
		--text: #e5e7eb;
		--dim: #94a3b8;
		--a: #c084fc;
		--b: #22d3ee;
		--warn: #fbbf24;
	}
	* { box-sizing: border-box; }
	html, body { height: 100%; margin: 0; }
	body {
		display: grid;
		place-items: center;
		padding: 1.5rem;
		background:
			radial-gradient(60rem 40rem at 50% -10%, #1a2338 0%, transparent 60%),
			var(--bg);
		color: var(--text);
		font: 400 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
		-webkit-font-smoothing: antialiased;
	}
	.card {
		width: min(30rem, 100%);
		padding: 2rem 1.75rem;
		border: 1px solid var(--line);
		border-radius: 1rem;
		background: var(--card);
		box-shadow: 0 1.5rem 3rem -1rem #000a;
		text-align: center;
	}
	.logo { width: 3.25rem; height: 3.25rem; margin: 0 auto .9rem; display: block; }
	h1 {
		margin: 0 0 .35rem;
		font-size: 1.5rem;
		letter-spacing: -.01em;
		background: linear-gradient(120deg, var(--a), var(--b));
		-webkit-background-clip: text;
		background-clip: text;
		color: transparent;
	}
	.state { margin: .1rem 0 1.1rem; color: var(--dim); font-size: .95rem; min-height: 1.55em; }
	.state b { color: var(--text); font-weight: 600; }

	.dots { display: inline-flex; gap: .3rem; vertical-align: middle; margin-left: .15rem; }
	.dots i {
		width: .3rem; height: .3rem; border-radius: 50%;
		background: var(--b); opacity: .35;
		animation: pulse 1.2s infinite;
	}
	.dots i:nth-child(2) { animation-delay: .2s; }
	.dots i:nth-child(3) { animation-delay: .4s; }
	@keyframes pulse { 50% { opacity: 1; transform: translateY(-.15rem); } }

	.target {
		display: block;
		margin: 0 0 1.1rem;
		padding: .6rem .75rem;
		border: 1px dashed var(--line);
		border-radius: .6rem;
		color: var(--b);
		font: 400 .85rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
		text-decoration: none;
		word-break: break-all;
	}
	.target:hover { border-color: var(--b); }

	button {
		appearance: none;
		padding: .6rem 1.15rem;
		border: 0;
		border-radius: .6rem;
		background: linear-gradient(120deg, var(--a), var(--b));
		color: #0b0f1a;
		font: 600 .95rem/1 inherit;
		cursor: pointer;
	}
	button:hover { filter: brightness(1.08); }
	button[disabled] { opacity: .5; cursor: default; filter: none; }

	.meta { margin: 1.25rem 0 0; color: #64748b; font-size: .78rem; }
	.meta a { color: #64748b; }
	.offline .badge {
		display: inline-block;
		margin-bottom: .9rem;
		padding: .15rem .55rem;
		border: 1px solid #3f3009;
		border-radius: 99rem;
		background: #241b06;
		color: var(--warn);
		font-size: .75rem;
		font-weight: 600;
		letter-spacing: .02em;
	}
	@media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: .7; } }
</style>
</head>
<body>
<main class="card" id="card">
	<svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
		<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#22d3ee"/>
		</linearGradient></defs>
		<rect x="6" y="4" width="52" height="56" rx="8" fill="#0b0f1a" stroke="url(#g)" stroke-width="3"/>
		<path d="M6 22 L58 22" stroke="url(#g)" stroke-width="3" stroke-dasharray="4 3"/>
		<path d="M20 34 l12 -8 l12 8 l-12 20 z" fill="url(#g)"/>
	</svg>
	<h1>PackRipper</h1>
	<p class="state" id="state">Finding the current link<span class="dots"><i></i><i></i><i></i></span></p>
	<div id="slot"></div>
	<p class="meta" id="meta"></p>
</main>

<script>
(() => {
	'use strict';

	const CONFIG = {
		repo: 'tahuffman1s/Pack-Ripper',
		branch: 'pages',
		// Project-page prefix, so a deep link keeps its path across the redirect:
		// /Pack-Ripper/packs -> <tunnel>/packs. Served anywhere else (a local
		// preview), the site is assumed to be at the root.
		base: '/Pack-Ripper/',
		// While offline. Long enough to be polite to a CDN, short enough that a
		// tab left open lands on the new tunnel by itself.
		pollMs: 15000,
		probeMs: 6000
	};

	const el = {
		card: document.getElementById('card'),
		state: document.getElementById('state'),
		slot: document.getElementById('slot'),
		meta: document.getElementById('meta')
	};

	const params = new URLSearchParams(location.search);
	// ?stay — look, report, do not navigate. For checking the plumbing without
	// being bounced off the page.
	const STAY = params.has('stay');
	const REMEMBERED = 'packripper:last-url';

	// ── where we came from ─────────────────────────────────────────
	// The site's own root. Not derived from location: this document is also
	// 404.html, so it answers for paths at any depth and "the directory I am in"
	// would be wrong for all of them.
	const BASE = location.hostname.endsWith('github.io') ? CONFIG.base : '/';

	// Everything after the site prefix is the app path being asked for. 404.html
	// is this same document, so an unknown path arrives here with its pathname
	// intact and we can hand it on.
	function requestedPath() {
		const base = BASE;
		let p = location.pathname;
		p = p.startsWith(base) ? p.slice(base.length) : p.replace(/^\//, '');
		p = p.replace(/^(index|404)\.html$/, '');
		const query = new URLSearchParams(location.search);
		query.delete('stay');
		const q = query.toString();
		return '/' + p + (q ? '?' + q : '') + location.hash;
	}
	const PATH = requestedPath();

	// ── status ────────────────────────────────────────────────────
	const bust = (u) => u + (u.includes('?') ? '&' : '?') + 't=' + Date.now();

	async function readOne(url) {
		try {
			const res = await fetch(bust(url), { cache: 'no-store' });
			if (!res.ok) return null;
			const s = await res.json();
			if (!s || typeof s !== 'object') return null;
			s.at = Date.parse(s.updatedAt || '') || 0;
			return s;
		} catch { return null; }
	}

	async function readStatus() {
		const raw = `https://raw.githubusercontent.com/${CONFIG.repo}/${CONFIG.branch}/status.json`;
		const found = (await Promise.all([readOne(BASE + 'status.json'), readOne(raw)])).filter(Boolean);
		if (!found.length) return null;
		// The Pages copy trails the branch by a deploy, and the raw CDN can hold
		// an old copy for a few minutes. Neither is reliably ahead, so go by the
		// timestamp inside the file rather than by which source it came from.
		return found.sort((a, b) => b.at - a.at)[0];
	}

	// ── liveness ──────────────────────────────────────────────────
	// A published URL is only a claim. /api/health sends
	// access-control-allow-origin: *, so a readable 200 means PackRipper itself
	// answered — not a Cloudflare 502 page, not a hostname that stopped
	// resolving, and not some other site.
	async function alive(url) {
		const stop = AbortSignal.timeout ? AbortSignal.timeout(CONFIG.probeMs) : undefined;
		try {
			const res = await fetch(url.replace(/\/$/, '') + '/api/health',
				{ cache: 'no-store', signal: stop, redirect: 'follow' });
			return res.ok;
		} catch { return false; }
	}

	// ── ui ────────────────────────────────────────────────────────
	const dots = '<span class="dots"><i></i><i></i><i></i></span>';
	const hostOf = (u) => { try { return new URL(u).host; } catch { return u; } };

	function ago(ms) {
		if (!ms) return null;
		const s = Math.max(0, (Date.now() - ms) / 1000);
		if (s < 90) return 'moments ago';
		const m = Math.round(s / 60);
		if (m < 60) return m + (m === 1 ? ' minute ago' : ' minutes ago');
		const h = Math.round(m / 60);
		if (h < 36) return h + (h === 1 ? ' hour ago' : ' hours ago');
		return Math.round(h / 24) + ' days ago';
	}

	function show({ state, target, badge, actions, meta }) {
		el.card.classList.toggle('offline', !!badge);
		el.state.innerHTML = (badge ? `<span class="badge">${badge}</span><br>` : '') + state;
		el.slot.innerHTML = target
			? `<a class="target" href="${target}">${target}</a>`
			: '';
		if (actions) el.slot.insertAdjacentHTML('beforeend', actions);
		el.meta.innerHTML = meta || '';
	}

	const REPO_LINK = `<a href="https://github.com/${CONFIG.repo}">${CONFIG.repo}</a>`;

	// ── loop ──────────────────────────────────────────────────────
	let timer = null;
	let countdown = null;
	let busy = false;

	function schedule(ms) {
		clearTimeout(timer);
		timer = setTimeout(check, ms);
	}

	async function check() {
		if (busy) return;
		busy = true;
		clearInterval(countdown);
		clearTimeout(timer);
		try {
			const status = await readStatus();
			const remembered = localStorage.getItem(REMEMBERED);

			// Candidates in order of authority. The remembered URL covers the
			// window where the app is back up but the status file has not
			// propagated yet.
			const candidates = [];
			if (status && status.up && status.url) candidates.push(status.url);
			if (remembered && !candidates.includes(remembered)) candidates.push(remembered);

			for (const url of candidates) {
				if (await alive(url)) return go(url, status);
			}
			offline(status, candidates);
		} finally {
			busy = false;
		}
	}

	function go(url, status) {
		localStorage.setItem(REMEMBERED, url);
		const target = url.replace(/\/$/, '') + PATH;
		if (STAY) {
			show({
				state: `Up at <b>${hostOf(url)}</b> — not redirecting (<code>?stay</code>).`,
				target,
				meta: `${status && status.kind === 'named' ? 'Named tunnel' : 'Quick tunnel'} · ${REPO_LINK}`
			});
			return;
		}
		show({ state: `Opening <b>${hostOf(url)}</b>${dots}`, target });
		// replace, not assign: the back button should leave the app, not bounce
		// through this page again.
		location.replace(target);
	}

	function offline(status, tried) {
		const seen = status && status.at ? ago(status.at) : null;
		const detail = !status
			? 'Could not read the status file.'
			: tried.length
				? 'The last known address is not answering.'
				: 'The server is not running.';

		let left = Math.round(CONFIG.pollMs / 1000);
		const line = () =>
			`${detail}<br>Watching for it to come back — retrying in <b>${left}s</b>.`;

		show({
			badge: 'offline',
			state: line(),
			actions: '<button id="now">Check now</button>',
			meta: [
				seen ? `Last seen ${seen}` : null,
				'This page redirects on its own once it is back.',
				REPO_LINK
			].filter(Boolean).join(' · ')
		});
		document.getElementById('now').onclick = (e) => { e.target.disabled = true; check(); };

		countdown = setInterval(() => {
			left -= 1;
			if (left <= 0) { clearInterval(countdown); return; }
			el.state.innerHTML = `<span class="badge">offline</span><br>` + line();
		}, 1000);
		schedule(CONFIG.pollMs);
	}

	// A backgrounded tab's timers are throttled to a minute or more, so someone
	// returning to it would stare at a stale "offline" for a while. Re-check the
	// moment it is looked at again.
	document.addEventListener('visibilitychange', () => {
		if (!document.hidden) check();
	});

	check();
})();
</script>
</body>
</html>
